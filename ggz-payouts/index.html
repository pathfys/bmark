<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>GGZ Payouts</title>
<style>
:root{--bg: #000000;--surface: #0a0a0a;--border: #1c1c1e;--border-strong: #333333;--text: #ffffff;--text-muted: #8e8e93;--glow: 0 0 20px rgba(255, 255, 255, .1);--green: #30d158;--green-dim: #1f8a3b;--green-glow: 0 0 18px rgba(48, 209, 88, .3);--ease: cubic-bezier(.16, 1, .3, 1);--fast: .18s var(--ease);--base: .28s var(--ease);color-scheme:dark}*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overscroll-behavior-y:none;overflow-x:hidden}#root{min-height:100vh;min-height:100dvh;background:var(--bg)}body,button{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}input,textarea{user-select:text;-webkit-user-select:text;font-family:inherit;color:inherit}button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}a{color:inherit;text-decoration:none}::-webkit-scrollbar{width:0;height:0}*{scrollbar-width:none}input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}input::placeholder{color:var(--text-muted);opacity:1}@keyframes spin{0%{transform:rotate(0)}to{transform:rotate(360deg)}}.settings-row+.settings-row{border-top:1px solid #1c1c1e}.pressable{transition:opacity .15s ease,transform .15s ease}.pressable:active{opacity:.6;transform:scale(.98)}:root{--tc-font-family: "Inter", sans-serif}@media (prefers-reduced-motion: reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
#splash{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;padding:24px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
#logo{font-size:clamp(56px,18vw,76px);font-weight:700;letter-spacing:-.04em;color:#fff;
  text-shadow:0 0 40px rgba(255,255,255,.18)}
#track{width:min(200px,54vw);height:3px;border-radius:999px;background:#1c1c1e;overflow:hidden}
#pbar{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#fff,#8e8e93);
  transition:width .35s ease}
#ptext{font-size:13px;color:#8e8e93}
#diag{display:none;font-size:11px;line-height:1.6;color:#8e8e93;text-align:left;max-width:460px;
  white-space:pre-wrap;word-break:break-all;user-select:text;-webkit-user-select:text}
#retry{display:none;padding:11px 26px;background:#30d158;color:#000;border:none;
  border-radius:12px;font-weight:600;font-size:14px;font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<div id="splash">
  <div id="logo">GGZ</div>
  <div id="track"><div id="pbar"></div></div>
  <div id="ptext">Загрузка…</div>
  <div id="diag"></div>
  <button id="retry" onclick="location.reload()">Повторить</button>
</div>

<script>
(function(){
  var BUNDLE = '/app-bundle.js', VER = '11';
  var SDK = ['/tg-sdk.js', 'https://telegram.org/js/telegram-web-app.js'];
  var pbar = document.getElementById('pbar');
  var ptext = document.getElementById('ptext');
  var notes = [], settled = false;

  function note(msg, bad){ notes.push((bad ? 'x ' : '+ ') + msg); }
  function bar(pct){ pbar.style.width = pct + '%'; }

  function stop(title){
    if(settled) return;
    settled = true;
    document.getElementById('track').style.display = 'none';
    ptext.textContent = title;
    ptext.style.color = '#ff453a';
    var d = document.getElementById('diag');
    d.textContent = notes.join('\n');
    d.style.display = 'block';
    document.getElementById('retry').style.display = 'inline-block';
  }

  function inject(src, module){
    return new Promise(function(res, rej){
      var s = document.createElement('script');
      if(module) s.type = 'module';
      s.src = src;
      s.onload = function(){ res(src); };
      s.onerror = function(){ rej(new Error(src)); };
      document.head.appendChild(s);
    });
  }

  // SDK берём со своего домена. Его отсутствие не должно хоронить загрузку,
  // поэтому бандл стартует в любом случае.
  function loadSdk(i){
    if(window.Telegram && window.Telegram.WebApp){ note('SDK already present'); return Promise.resolve(); }
    if(i >= SDK.length){ note('SDK not loaded from any source', 1); return Promise.resolve(); }
    return inject(SDK[i], false)
      .then(function(src){ note('SDK <- ' + src); })
      .catch(function(){ note('SDK failed <- ' + SDK[i], 1); return loadSdk(i + 1); });
  }

  window.addEventListener('error', function(ev){
    if(ev.message) note('JS: ' + ev.message + ' @' + (ev.lineno || '?'), 1);
  });

  bar(15);
  var guard = setTimeout(function(){ stop('Зависло на загрузке'); }, 45000);

  loadSdk(0).then(function(){
    bar(35);
    try{
      if(window.Telegram && window.Telegram.WebApp){
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
        note('initData len=' + (Telegram.WebApp.initData || '').length);
      }
    }catch(e){ note('tg.ready failed: ' + e.message, 1); }

    ptext.textContent = 'Почти готово…';
    bar(55);
    return inject(BUNDLE + '?v=' + VER, true);
  }).then(function(){
    clearTimeout(guard);
    note('bundle loaded');
    bar(100);
    setTimeout(function(){
      if(document.getElementById('root').children.length === 0){
        note('bundle ran but #root is empty', 1);
        stop('Приложение не отрисовалось');
      } else {
        settled = true;
        document.getElementById('splash').style.display = 'none';
      }
    }, 700);
  }).catch(function(e){
    clearTimeout(guard);
    note('bundle failed: ' + (e && e.message ? e.message : '?'), 1);
    stop('Бандл не загрузился');
  });
})();
</script>
</body>
</html>
