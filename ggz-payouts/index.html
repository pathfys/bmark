<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>GGZ Payouts</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>:root{--bg:#000;--surface:#0a0a0a;--border:#1c1c1e;--text:#fff;--text-muted:#8e8e93;--green:#30d158;--ease:cubic-bezier(.16,1,.3,1);--fast:.18s var(--ease);--base:.28s var(--ease);color-scheme:dark}*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;overflow-x:hidden}#root{min-height:100vh;min-height:100dvh;background:var(--bg)}body,button{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}input,textarea{user-select:text;-webkit-user-select:text;font-family:inherit;color:inherit}button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}a{color:inherit;text-decoration:none}::-webkit-scrollbar{width:0;height:0}*{scrollbar-width:none}</style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" style="position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px">
      <div style="font-size:clamp(56px,18vw,76px);font-weight:700;letter-spacing:-0.04em;color:#fff;text-shadow:0 0 40px rgba(255,255,255,0.18)">GGZ</div>
      <div style="width:min(200px,54vw);height:3px;border-radius:999px;background:#1c1c1e;overflow:hidden">
        <div id="pbar" style="height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#fff,#8e8e93);transition:width 0.3s ease"></div>
      </div>
      <span style="font-size:13px;color:#8e8e93;animation:pulse 1.6s ease-in-out infinite">Loading...</span>
    </div>
    <style>@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}</style>
    <script>
      var pb = document.getElementById('pbar');
      pb.style.width = '30%';
      setTimeout(function() {
        pb.style.width = '60%';
        var s = document.createElement('script');
        s.type = 'module';
        s.src = '/app-bundle.js?v=7';
        s.onload = function() {
          pb.style.width = '100%';
          setTimeout(function() {
            var sp = document.getElementById('splash');
            if (sp) sp.style.display = 'none';
          }, 300);
        };
        s.onerror = function() {
          document.getElementById('splash').innerHTML =
            '<div style="text-align:center;padding:20px">' +
            '<div style="font-size:48px;margin-bottom:16px">GGZ</div>' +
            '<div style="color:#8e8e93;font-size:14px">Loading error. Please try again.</div>' +
            '<button onclick="location.reload()" style="margin-top:16px;padding:10px 24px;background:#30d158;color:#000;border-radius:12px;font-weight:600;font-size:14px">Retry</button>' +
            '</div>';
        };
        document.body.appendChild(s);
      }, 100);
    </script>
  </body>
</html>
