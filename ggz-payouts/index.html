<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>GGZ Payouts</title>
<style>
:root{--bg: #000000;--surface: #0a0a0a;--border: #1c1c1e;--border-strong: #333333;--text: #ffffff;--text-muted: #8e8e93;--glow: 0 0 20px rgba(255, 255, 255, .1);--green: #30d158;--green-dim: #1f8a3b;--green-glow: 0 0 18px rgba(48, 209, 88, .3);--ease: cubic-bezier(.16, 1, .3, 1);--fast: .18s var(--ease);--base: .28s var(--ease);color-scheme:dark}*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overscroll-behavior-y:none;overflow-x:hidden}#root{min-height:100vh;min-height:100dvh;background:var(--bg)}body,button{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}input,textarea{user-select:text;-webkit-user-select:text;font-family:inherit;color:inherit}button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}a{color:inherit;text-decoration:none}::-webkit-scrollbar{width:0;height:0}*{scrollbar-width:none}input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}input::placeholder{color:var(--text-muted);opacity:1}@keyframes spin{0%{transform:rotate(0)}to{transform:rotate(360deg)}}.settings-row+.settings-row{border-top:1px solid #1c1c1e}.pressable{transition:opacity .15s ease,transform .15s ease}.pressable:active{opacity:.6;transform:scale(.98)}:root{--tc-font-family: "Inter", sans-serif}@media (prefers-reduced-motion: reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
#splash{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:28px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
#logo{font-size:clamp(56px,18vw,76px);font-weight:700;letter-spacing:-.04em;color:#fff;
  text-shadow:0 0 40px rgba(255,255,255,.18)}
#track{width:min(200px,54vw);height:3px;border-radius:999px;background:#1c1c1e;overflow:hidden}
#pbar{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#fff,#8e8e93);
  transition:width .3s ease}
#ptext{font-size:13px;color:#8e8e93;animation:pulse 1.6s ease-in-out infinite}
#err{display:none;padding:0 24px;text-align:center;max-width:460px}
#err b{display:block;font-size:15px;color:#ff453a;margin-bottom:10px}
#err span{font-size:12px;color:#8e8e93;word-break:break-all;user-select:text;-webkit-user-select:text}
#err button{margin-top:18px;padding:11px 26px;background:#30d158;color:#000;border:none;
  border-radius:12px;font-weight:600;font-size:14px;font-family:inherit}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
</style>
</head>
<body>
<div id="root"></div>
<div id="splash">
  <div id="logo">GGZ</div>
  <div id="track"><div id="pbar"></div></div>
  <div id="ptext">Загрузка…</div>
  <div id="err"><b>Не удалось загрузить</b><span id="errmsg"></span>
    <button onclick="location.reload()">Повторить</button></div>
</div>

<script>
(function(){
  var CHUNKS=['/chunks/c0.js','/chunks/c1.js','/chunks/c2.js','/chunks/c3.js'];
  var VER='10';
  var SDK_LOCAL='/tg-sdk.js';
  var SDK_CDN='https://telegram.org/js/telegram-web-app.js';
  var pbar=document.getElementById('pbar'), ptext=document.getElementById('ptext');
  var done=0, steps=CHUNKS.length+2;

  function progress(){ pbar.style.width=Math.round(++done/steps*100)+'%'; }

  function fail(msg){
    document.getElementById('logo').style.display='none';
    document.getElementById('track').style.display='none';
    ptext.style.display='none';
    document.getElementById('errmsg').textContent=msg;
    document.getElementById('err').style.display='block';
  }

  // SDK грузится динамически, а не тегом в <head>: блокирующий скрипт
  // с недоступного хоста держит отрисовку до таймаута, и Telegram успевает
  // показать «Сервер недоступен» раньше, чем мы что-либо нарисуем.
  function loadSdk(){
    if(window.Telegram&&window.Telegram.WebApp) return Promise.resolve();
    return inject(SDK_LOCAL).catch(function(){ return inject(SDK_CDN); });
  }
  function inject(src){
    return new Promise(function(res,rej){
      var s=document.createElement('script');
      s.src=src; s.onload=res; s.onerror=function(){rej(new Error(src));};
      document.head.appendChild(s);
    });
  }

  function grab(url){
    return fetch(url+'?v='+VER).then(function(r){
      if(!r.ok) throw new Error(url+' вернул HTTP '+r.status);
      return r.text();
    }).then(function(t){ progress(); return t; });
  }

  loadSdk().then(function(){
    progress();
    try{ if(window.Telegram&&window.Telegram.WebApp){ Telegram.WebApp.ready(); Telegram.WebApp.expand(); } }catch(e){}
    return Promise.all(CHUNKS.map(grab));
  }).then(function(parts){
    var code=parts.join('');
    if(/^\s*</.test(code)) throw new Error('вместо JS пришёл HTML — проверь /chunks/ на сервере');
    if(code.length<1000000) throw new Error('бандл неполный: '+code.length+' символов');

    var url=URL.createObjectURL(new Blob([code],{type:'application/javascript'}));
    var s=document.createElement('script');
    s.type='module'; s.src=url;
    s.onload=function(){
      URL.revokeObjectURL(url); progress();
      setTimeout(function(){ document.getElementById('splash').style.display='none'; },300);
    };
    s.onerror=function(){ URL.revokeObjectURL(url); fail('бандл не выполнился'); };
    document.body.appendChild(s);
  }).catch(function(e){
    fail(e&&e.message?e.message:'сеть недоступна');
  });
})();
</script>
</body>
</html>
