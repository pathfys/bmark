<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GGZ Diag 3</title>
<style>
html,body{margin:0;background:#000;color:#fff;font:13px/1.55 -apple-system,monospace}
#h{padding:14px;font-size:17px;font-weight:700;border-bottom:1px solid #222}
#log{padding:12px 14px;white-space:pre-wrap;word-break:break-all;
  user-select:text;-webkit-user-select:text}
.ok{color:#30d158}.err{color:#ff453a}.inf{color:#8e8e93}.big{color:#ffd60a;font-weight:700}
</style>
</head>
<body>
<div id="h">GGZ DIAG v3 — auth</div>
<div id="log"></div>
<script>
(function(){
  var L=document.getElementById('log');
  function add(c,m){var d=document.createElement('div');d.className=c;d.textContent=m;L.appendChild(d);}

  function inject(src){
    return new Promise(function(res,rej){
      var s=document.createElement('script');
      s.src=src; s.onload=res; s.onerror=function(){rej(new Error(src));};
      document.head.appendChild(s);
    });
  }

  add('ok','[1] page rendered');

  inject('/tg-sdk.js').then(function(){
    var tg=window.Telegram&&window.Telegram.WebApp;
    if(!tg){ add('err','[2] WebApp ABSENT — дальше нет смысла'); return; }
    try{ tg.ready(); tg.expand(); }catch(e){}
    var init=tg.initData||'';
    add('ok','[2] SDK ok, initData length='+init.length);
    if(!init){ add('err','    initData ПУСТОЙ — Telegram не передал данные'); return; }

    // Разбираем initData так же, как это делает сервер.
    try{
      var p=new URLSearchParams(init);
      var ad=parseInt(p.get('auth_date')||'0',10);
      var age=Math.floor(Date.now()/1000)-ad;
      add('inf','    auth_date='+ad+'  возраст='+age+'s  (сервер отвергает >3600s)');
      add('inf','    hash='+(p.get('hash')||'').slice(0,20)+'...');
      var u=p.get('user'); if(u) add('inf','    user='+u.slice(0,90));
    }catch(e){ add('err','    разбор initData упал: '+e.message); }

    // Тот же запрос, что делает приложение, но БЕЗ таймаута в 8 секунд,
    // чтобы отличить медленный ответ от ошибки.
    add('big','[3] POST /api/auth ... (без таймаута)');
    var t0=Date.now();
    return fetch('/api/auth',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({initData:init}),
      credentials:'omit'
    }).then(function(r){
      var ms=Date.now()-t0;
      return r.text().then(function(txt){
        var slow=ms>8000;
        add(r.ok?'ok':'err','[4] HTTP '+r.status+'  за '+ms+'ms'+(slow?'  <-- ДОЛЬШЕ 8s, приложение бы оборвало':''));
        add(r.ok?'ok':'err','    '+txt.slice(0,400));
        if(r.ok && slow) add('big','ВЫВОД: сервер отвечает верно, но слишком медленно.');
        else if(r.ok) add('big','ВЫВОД: авторизация проходит. Причина в другом месте.');
        else add('big','ВЫВОД: сервер отвергает авторизацию, причина в ответе выше.');
      });
    }).catch(function(e){
      add('err','[4] запрос упал за '+(Date.now()-t0)+'ms: '+e.message);
      add('big','ВЫВОД: до сервера не дошло — сеть или блокировка.');
    });
  }).catch(function(e){
    add('err','FAILED: '+(e&&e.message?e.message:e));
  });
})();
</script>
</body>
</html>
