<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Exchange</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0B0E11;--bg2:#1E2026;--card:#2B3139;
  --t1:#EAECEF;--t2:#848E9C;
  --yellow:#F0B90B;--yellow-h:#D4A20A;
  --green:#0ECB81;--red:#F6465D;
  --border:#2B3139;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--t1);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;max-width:430px;margin:0 auto}
input,textarea,select{outline:none;font-family:inherit;font-size:14px}
input::placeholder,textarea::placeholder{color:var(--t2)}
button{cursor:pointer;border:none;font-family:inherit;transition:transform .1s}
button:active{transform:scale(0.96)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--card);border-radius:2px}

.page{display:none;min-height:100vh;padding-bottom:72px}
.page.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

#splash{display:flex;align-items:center;justify-content:center;flex-direction:column;
  position:fixed;inset:0;background:var(--bg);z-index:100}
#splash .splash-logo{opacity:0;transform:scale(.8);animation:splashLogoIn .8s ease forwards}
@keyframes splashLogoIn{to{opacity:1;transform:scale(1)}}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;
  background:var(--bg2);border-top:1px solid var(--border);display:flex;
  justify-content:space-around;align-items:center;height:64px;z-index:50}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 16px;
  background:none;transition:color .2s,filter .2s}
.nav-btn svg{width:24px;height:24px}
.nav-btn span{font-size:11px;font-weight:500}
.nav-btn.active svg{stroke:var(--yellow);filter:drop-shadow(0 0 4px rgba(240,185,11,0.4))}
.nav-btn.active span{color:var(--yellow)}
.nav-btn:not(.active) svg{stroke:var(--t2)}
.nav-btn:not(.active) span{color:var(--t2)}

.wallet-card{margin:0 16px;border-radius:16px;padding:20px;
  background:linear-gradient(to bottom,var(--card),var(--bg2))}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:700;color:var(--bg);background:var(--yellow)}

#balance-amount{cursor:pointer;transition:filter .3s ease;user-select:none}
#balance-amount.blurred{filter:blur(8px)}

.pnl-row{display:flex;align-items:center;gap:6px;margin-top:2px}
.pnl-label{color:var(--t2);font-size:12px}
.pnl-value{font-size:12px;font-weight:600}
.pnl-value.up{color:var(--green)}
.pnl-value.down{color:var(--red)}

.banner-wrap{margin:16px;position:relative;overflow:hidden;border-radius:16px;aspect-ratio:2.2/1}
.banner{position:absolute;inset:0;padding:0;display:flex;align-items:center;justify-content:center;
  border-radius:16px;transition:transform .35s ease,opacity .35s ease;cursor:pointer;overflow:hidden}
.banner.hide-left{transform:translateX(-100%);opacity:0}
.banner.hide-right{transform:translateX(100%);opacity:0}
.banner.visible{transform:translateX(0);opacity:1}
.banner:active{transform:scale(0.97)!important}
.banner img{width:100%;height:100%;object-fit:cover;border-radius:16px;pointer-events:none}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dot{width:6px;height:6px;border-radius:3px;background:var(--card);transition:all .3s;cursor:pointer}
.dot.active{width:16px;background:var(--yellow)}

.order-card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px}
.toggle-row{display:flex;margin:12px 16px 0;background:var(--card);border-radius:8px;overflow:hidden}
.toggle-btn{flex:1;padding:12px;text-align:center;font-size:14px;font-weight:600;
  background:none;color:var(--t2);transition:all .2s}
.toggle-btn.active-buy{background:var(--green);color:#fff}
.toggle-btn.active-sell{background:var(--red);color:#fff}
.toggle-btn.active-yellow{background:var(--yellow);color:var(--bg)}

.filter-row{display:flex;gap:8px;margin:12px 16px 0}
.filter-row select{flex:1;background:var(--card);color:var(--t1);border:1px solid var(--border);
  border-radius:8px;padding:8px 12px}

.form-group{margin-bottom:16px}
.form-group label{display:block;color:var(--t2);font-size:13px;margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--card);
  color:var(--t1);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.form-group textarea{resize:none;height:80px}

.btn-primary{width:100%;padding:12px;background:var(--yellow);color:var(--bg);border-radius:8px;
  font-size:14px;font-weight:600;transition:background .2s,transform .1s}
.btn-primary:hover{background:var(--yellow-h)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{padding:10px 20px;background:none;border:1px solid var(--yellow);color:var(--yellow);
  border-radius:8px;font-size:14px;font-weight:500;transition:all .2s}
.btn-outline:hover{background:var(--yellow);color:var(--bg)}
.btn-green{background:var(--green);color:#fff;border-radius:8px;padding:12px;font-weight:600;font-size:14px}
.btn-red-o{background:var(--card);color:var(--red);border:1px solid var(--red);border-radius:8px;
  padding:12px;font-weight:600;font-size:14px}

.badge{display:inline-block;padding:2px 12px;border-radius:20px;font-size:11px;font-weight:500}
.badge-pending{background:rgba(240,185,11,.2);color:var(--yellow)}
.badge-paid{background:rgba(59,130,246,.2);color:#60a5fa}
.badge-completed{background:rgba(14,203,129,.2);color:var(--green)}
.badge-cancelled{background:rgba(246,70,93,.2);color:var(--red)}
.badge-disputed{background:rgba(249,115,22,.2);color:#fb923c}

.section-title{color:var(--t1);font-size:15px;font-weight:600;margin:24px 16px 12px}
.empty{color:var(--t2);font-size:14px;text-align:center;padding:32px 0}
.deal-info{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px}
.deal-info .row{display:flex;justify-content:space-between;margin-bottom:8px}
.deal-info .row .label{color:var(--t2);font-size:13px}
.deal-info .row .value{color:var(--t1);font-size:14px;font-weight:500}

.timer-box{background:rgba(240,185,11,.1);border:1px solid rgba(240,185,11,.3);
  border-radius:12px;padding:12px;text-align:center;margin-bottom:16px}
.timer-box .label{color:var(--t2);font-size:12px}
.timer-box .time{color:var(--yellow);font-size:28px;font-weight:700}

.chat-box{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:16px}
.chat-header{padding:8px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:500}
.chat-messages{height:250px;overflow-y:auto;padding:12px}
.chat-msg{max-width:75%;margin-bottom:8px;padding:8px 12px;border-radius:12px;font-size:14px;word-break:break-word}
.chat-msg.mine{margin-left:auto;background:var(--yellow);color:var(--bg);border-bottom-right-radius:4px}
.chat-msg.other{background:var(--bg2);color:var(--t1);border-bottom-left-radius:4px}
.chat-msg .sender{font-size:11px;color:var(--t2);margin-bottom:2px}
.chat-msg .time{font-size:10px;margin-top:2px;opacity:.6}
.chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)}
.chat-input input{flex:1;background:var(--bg2);color:var(--t1);border:none;border-radius:8px;padding:8px 12px}
.chat-input button{background:var(--yellow);color:var(--bg);border-radius:8px;padding:8px 16px;
  font-size:13px;font-weight:600}

.back-btn{background:none;color:var(--t2);padding:8px}
.back-btn svg{width:24px;height:24px;stroke:currentColor;stroke-width:2}
.page-header{display:flex;align-items:center;gap:12px;padding:12px 16px}
.page-header h1{font-size:18px;font-weight:600;color:var(--t1)}

.lang-switch{display:flex;background:var(--card);border-radius:8px;overflow:hidden}
.lang-btn{padding:8px 16px;font-size:14px;font-weight:500;background:none;color:var(--t2);transition:all .2s}
.lang-btn.active{background:var(--yellow);color:var(--bg)}

.profile-card{background:var(--card);border-radius:12px;padding:20px;display:flex;
  flex-direction:column;align-items:center;margin:0 16px 16px}

.crypto-icons{display:flex;gap:12px;margin-bottom:20px}
.crypto-icon{display:flex;align-items:center;gap:4px}
.crypto-icon .sym{color:var(--yellow);font-size:14px;display:flex;align-items:center}
.crypto-icon .sym img{width:20px;height:20px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,0.08)}
.crypto-icon .name{color:var(--t2);font-size:12px}

.pay-badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.pay-badge{padding:2px 8px;background:var(--bg2);border-radius:4px;font-size:12px;color:var(--t2)}

.txn-row{background:var(--card);border-radius:12px;padding:12px;display:flex;align-items:center;
  justify-content:space-between;margin-bottom:8px;cursor:pointer;transition:transform .1s}
.txn-row:active{transform:scale(0.97)}
.txn-left{display:flex;align-items:center;gap:12px}
.txn-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:14px}
.txn-icon.buy{background:rgba(14,203,129,.2);color:var(--green)}
.txn-icon.sell{background:rgba(246,70,93,.2);color:var(--red)}

.market-card{background:var(--card);border-radius:12px;padding:12px 16px;margin-bottom:8px;
  display:flex;align-items:center;gap:12px}
.market-icon{width:32px;height:32px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,0.08)}
.market-info{flex:1;min-width:0}
.market-name{font-size:14px;font-weight:600;color:var(--t1)}
.market-sym{font-size:12px;color:var(--t2)}
.market-right{display:flex;align-items:center;gap:8px}
.market-price{font-size:13px;font-weight:600;color:var(--t1)}
.market-change{font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;margin-top:2px}
.market-change.up{color:var(--green);background:rgba(14,203,129,.15)}
.market-change.down{color:var(--red);background:rgba(246,70,93,.15)}

.create-deal-btn{display:flex;align-items:center;justify-content:center;gap:8px;
  margin:16px;padding:14px;background:var(--yellow);color:var(--bg);border-radius:12px;
  font-size:15px;font-weight:700;box-shadow:0 4px 16px rgba(240,185,11,.25)}
.create-deal-btn:hover{background:var(--yellow-h)}
.create-deal-btn svg{width:20px;height:20px;stroke:var(--bg);stroke-width:2.5}

/* Stats Grid */
.stats-grid-wrap{background:var(--card);border-radius:12px;padding:16px;margin:0 16px 16px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-mini{background:var(--bg2);border-radius:10px;padding:14px 10px;text-align:center}
.stat-mini .stat-val{font-size:20px;font-weight:700;color:var(--yellow)}
.stat-mini .stat-label{font-size:11px;color:var(--t2);margin-top:4px}

/* ═══ WALLET PAGE ═══ */
.wallet-hero{display:flex;flex-direction:column;align-items:center;padding:24px 16px 8px}
.coin-3d-wrap{perspective:800px;margin-bottom:20px;cursor:grab}
.coin-3d-wrap:active{cursor:grabbing}
.coin-3d{
  width:90px;height:90px;border-radius:50%;
  background:linear-gradient(145deg,#F5CE42 0%,#F0B90B 40%,#D4A20A 100%);
  display:flex;align-items:center;justify-content:center;
  transform-style:preserve-3d;
  animation:coinFloat 4s ease-in-out infinite;
  box-shadow:0 8px 32px rgba(240,185,11,0.35),0 0 60px rgba(240,185,11,0.12);
  transition:transform .15s ease-out;
  position:relative;
}
.coin-3d::after{
  content:'';position:absolute;inset:3px;border-radius:50%;
  border:2px solid rgba(255,255,255,0.25);pointer-events:none;
}
.coin-3d svg{width:40px;height:40px;fill:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.coin-3d.interacting{animation:none}
@keyframes coinFloat{
  0%,100%{transform:translateY(0) rotateY(0deg) rotateX(5deg)}
  25%{transform:translateY(-10px) rotateY(90deg) rotateX(0deg)}
  50%{transform:translateY(-16px) rotateY(180deg) rotateX(-5deg)}
  75%{transform:translateY(-10px) rotateY(270deg) rotateX(0deg)}
}

.bind-wallet-btn{display:flex;align-items:center;justify-content:center;gap:10px;
  margin:0 16px 20px;padding:14px;background:var(--yellow);color:var(--bg);border-radius:12px;
  font-size:15px;font-weight:700;box-shadow:0 4px 16px rgba(240,185,11,.25)}
.bind-wallet-btn:hover{background:var(--yellow-h)}
.bind-wallet-btn svg{width:22px;height:22px}

.wcrypto-card{background:var(--card);border-radius:12px;margin:0 16px 8px;overflow:hidden;
  transition:transform .1s}
.wcrypto-card:active{transform:scale(0.98)}
.wcrypto-header{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.wcrypto-icon{width:36px;height:36px;border-radius:50%;object-fit:cover;
  background:rgba(255,255,255,0.08);flex-shrink:0}
.wcrypto-info{flex:1;min-width:0}
.wcrypto-name{font-size:14px;font-weight:600;color:var(--t1)}
.wcrypto-sym{font-size:12px;color:var(--t2)}
.wcrypto-bal{text-align:right}
.wcrypto-bal .amt{font-size:14px;font-weight:600;color:var(--t1)}
.wcrypto-bal .usd{font-size:11px;color:var(--t2)}
.wcrypto-chevron{color:var(--t2);transition:transform .2s;flex-shrink:0}
.wcrypto-chevron.open{transform:rotate(180deg)}
.wcrypto-expand{padding:0 16px 14px;display:none}
.wcrypto-expand.open{display:block}
.wcrypto-input-row{display:flex;gap:8px}
.wcrypto-input-row input{flex:1;background:var(--bg2);color:var(--t1);border:1px solid var(--border);
  border-radius:8px;padding:9px 12px;font-size:12px;font-family:'Inter',monospace;transition:border-color .2s}
.wcrypto-input-row input.valid{border-color:var(--green)}
.wcrypto-input-row input.invalid{border-color:var(--red)}
.wcrypto-input-row button{background:var(--yellow);color:var(--bg);border-radius:8px;
  padding:0 14px;font-size:12px;font-weight:600;white-space:nowrap}
.wcrypto-status{font-size:11px;margin-top:4px;min-height:14px}
.wcrypto-status.ok{color:var(--green)}
.wcrypto-status.err{color:var(--red)}
.wcrypto-saved{display:flex;align-items:center;gap:8px;background:var(--bg2);border-radius:8px;
  padding:9px 12px;font-size:12px;font-family:'Inter',monospace;color:var(--t1)}
.wcrypto-saved .addr{flex:1;overflow:hidden;text-overflow:ellipsis}
.wcrypto-saved button{background:none;color:var(--yellow);font-size:11px;font-weight:600;padding:2px 6px}

.wfiat-card{background:var(--card);border-radius:12px;padding:14px 16px;margin:0 16px 8px;
  display:flex;align-items:center;gap:12px}
.wfiat-flag{font-size:24px;width:36px;text-align:center;flex-shrink:0}
.wfiat-info{flex:1}
.wfiat-name{font-size:14px;font-weight:600;color:var(--t1)}
.wfiat-sym{font-size:12px;color:var(--t2)}
.wfiat-bal{font-size:14px;font-weight:600;color:var(--t1)}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-logo">
    <img src="assets/Binance-welcome screen.png" alt="Logo" width="160"
         style="border-radius:0" onerror="this.style.display='none'">
  </div>
</div>

<!-- HOME -->
<div id="page-home" class="page">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <div class="avatar" style="width:32px;height:32px;font-size:13px" id="home-avatar">D</div>
      <span style="font-size:14px;font-weight:500" id="home-greeting">Hi, Demo</span>
    </div>
    <button style="background:none;padding:8px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#848E9C" stroke-width="2" stroke-linecap="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </button>
  </div>

  <div class="wallet-card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <span style="color:var(--t2);font-size:13px" id="lbl-balance">Estimated Balance</span>
      <button onclick="toggleBalance()" style="background:none;padding:4px" id="eye-btn"></button>
    </div>
    <div>
      <span style="font-size:28px;font-weight:700" id="balance-amount" onclick="toggleBalance()"></span>
    </div>
    <div class="pnl-row" id="pnl-row">
      <span class="pnl-label" id="pnl-label">PnL Today</span>
      <span class="pnl-value up" id="pnl-value">+$0.00</span>
      <span class="pnl-value up" id="pnl-pct">+0.00%</span>
    </div>
    <div style="margin-top:14px"></div>
    <div class="crypto-icons" id="crypto-icons-row"></div>
    <div style="display:flex;gap:12px">
      <button class="btn-outline" style="flex:1" id="btn-deposit">Deposit</button>
      <button class="btn-outline" style="flex:1" id="btn-withdraw">Withdraw</button>
    </div>
  </div>

  <button class="create-deal-btn" onclick="showPage('create-order')" id="btn-create-deal">
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    <span id="lbl-create-deal">Create Deal</span>
  </button>

  <div class="banner-wrap" id="banner-container"></div>
  <div class="dots" id="banner-dots"></div>

  <div class="section-title" id="lbl-markets">Markets</div>
  <div style="padding:0 16px" id="markets-list"></div>

  <div class="section-title" id="lbl-recent">Recent Transactions</div>
  <div style="padding:0 16px" id="recent-deals"></div>
</div>

<!-- WALLET -->
<div id="page-wallet" class="page">
  <div class="page-header"><h1 id="lbl-wallet-title">Wallet</h1></div>

  <div class="wallet-hero">
    <div class="coin-3d-wrap" id="coin3d-wrap">
      <div class="coin-3d" id="coin3d">
        <svg viewBox="0 0 126.6 126.6" xmlns="http://www.w3.org/2000/svg">
          <path d="M38.7 53.4L63.3 28.8l24.6 24.6-14.3 14.3L63.3 57.4l-10.3 10.3zm0 19.8l14.3-14.3 10.3 10.3 10.3-10.3 14.3 14.3L63.3 97.8zm24.6-9.9l10.3-10.3 14.3 14.3-10.3 10.3zm-24.6 0L24.4 49.1 38.7 34.8l14.3 14.3zm0 0L24.4 77.5l14.3 14.3 14.3-14.3zM63.3 0a63.3 63.3 0 100 126.6A63.3 63.3 0 0063.3 0z"/>
        </svg>
      </div>
    </div>
  </div>

  <button class="bind-wallet-btn" onclick="scrollToWalletCrypto()" id="btn-bind-wallet">
    <svg viewBox="0 0 126.6 126.6" fill="#fff" xmlns="http://www.w3.org/2000/svg">
      <path d="M38.7 53.4L63.3 28.8l24.6 24.6-14.3 14.3L63.3 57.4l-10.3 10.3zm0 19.8l14.3-14.3 10.3 10.3 10.3-10.3 14.3 14.3L63.3 97.8zm24.6-9.9l10.3-10.3 14.3 14.3-10.3 10.3zm-24.6 0L24.4 49.1 38.7 34.8l14.3 14.3zm0 0L24.4 77.5l14.3 14.3 14.3-14.3zM63.3 0a63.3 63.3 0 100 126.6A63.3 63.3 0 0063.3 0z"/>
    </svg>
    <span id="lbl-bind-wallet">Bind Wallet</span>
  </button>

  <div class="section-title" id="lbl-crypto-section">Cryptocurrencies</div>
  <div id="wallet-crypto-list"></div>

  <div class="section-title" id="lbl-fiat-section">Fiat Currencies</div>
  <div id="wallet-fiat-list"></div>
</div>

<!-- CREATE ORDER -->
<div id="page-create-order" class="page">
  <div class="page-header">
    <button class="back-btn" onclick="showPage('home')"><svg viewBox="0 0 24 24" fill="none"><polyline points="15,18 9,12 15,6"/></svg></button>
    <h1 id="lbl-create-order">Create Order</h1>
  </div>
  <div style="padding:0 16px">
    <div class="form-group">
      <label id="lbl-side">I want to</label>
      <div class="toggle-row" style="margin:4px 0 0">
        <button class="toggle-btn active-buy" onclick="setCoSide('buy')" id="co-buy-btn">Buy</button>
        <button class="toggle-btn" onclick="setCoSide('sell')" id="co-sell-btn">Sell</button>
      </div>
    </div>
    <div class="form-group">

function renderBanners() {
  var container = document.getElementById('banner-container');
  var dotsEl = document.getElementById('banner-dots');
  container.innerHTML = '';
  dotsEl.innerHTML = '';
  bannerData.forEach(function(b, i) {
    var div = document.createElement('div');
    div.className = 'banner ' + (i === bannerIdx ? 'visible' : 'hide-right');
    div.innerHTML = '<img src="'+b.img+'" alt="" onerror="this.parentElement.style.display=\'none\'">';
    div.onclick = function() { bannerClick(div); };
    container.appendChild(div);

    var dot = document.createElement('button');
    dot.className = 'dot' + (i === bannerIdx ? ' active' : '');
    dot.onclick = (function(idx) { return function() { bannerIdx = idx; updateBanners(); }; })(i);
    dotsEl.appendChild(dot);
  });

  if (bannerTimer) clearInterval(bannerTimer);
  bannerTimer = setInterval(function() {
    bannerIdx = (bannerIdx + 1) % bannerData.length;
    updateBanners();
  }, 4000);

  var startX = 0;
  container.ontouchstart = function(e) { startX = e.touches[0].clientX; };
  container.ontouchend = function(e) {
    var diff = startX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) {
      bannerIdx = diff > 0
        ? (bannerIdx + 1) % bannerData.length
        : (bannerIdx - 1 + bannerData.length) % bannerData.length;
      updateBanners();
    }
  };
}

function bannerClick(el) {
  el.style.transform = 'scale(0.97)';

function updateBanners() {
  var banners = document.querySelectorAll('#banner-container .banner');
  var dots = document.querySelectorAll('#banner-dots .dot');
  banners.forEach(function(b, i) {
    b.className = 'banner ' + (i === bannerIdx ? 'visible' : (i < bannerIdx ? 'hide-left' : 'hide-right'));
  });
  dots.forEach(function(d, i) { d.className = 'dot' + (i === bannerIdx ? ' active' : ''); });
}

function sampleArr(arr, n) {
  if (arr.length <= n) return arr;
  var step = (arr.length - 1) / (n - 1);
  return Array.from({length:n}, function(_,i) { return arr[Math.round(i * step)]; });
}

function sparkSvg(prices, up, w, h) {
  if (!prices || prices.length < 2) return '';
  var step = w / (prices.length - 1);
  var mn = Math.min.apply(null, prices), mx = Math.max.apply(null, prices), rng = mx - mn || 1;
  var pts = prices.map(function(p,i) { return (i*step).toFixed(1)+','+((h-((p-mn)/rng)*(h-4)-2)).toFixed(1); }).join(' ');
  var c = up ? '#0ECB81' : '#F6465D';
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><polyline fill="none" stroke="'+c+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" points="'+pts+'"/></svg>';
}

async function fetchMarkets() {
  var ids = Object.values(cgMap).map(function(c) { return c.id; }).join(',');
  try {
    var r = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids='+ids+'&sparkline=true&price_change_percentage=24h');
    if (!r.ok) return;
    marketCache = await r.json();
    renderMarkets();
  } catch(e) {}
}

function renderMarkets() {
  var el = document.getElementById('markets-list');
  if (!el) return;
  var coins = ['BTC','ETH','USDT','GRAM','BNB','SOL'];
  if (!marketCache) {
    el.innerHTML = coins.map(function(sym) {
      var info = cgMap[sym];
      return '<div class="market-card">'+
        '<img class="market-icon" src="'+(cryptoIcons[sym]||'')+'" alt="'+sym+'" onerror="this.outerHTML=\'<div class=market-icon style=display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--yellow)>'+(cryptoFallback[sym]||sym[0])+'</div>\'">'+
        '<div class="market-info"><div class="market-name">'+info.name+'</div><div class="market-sym">'+sym+'</div></div>'+
        '<div class="market-right"><span class="market-price" style="color:var(--t2)">--</span></div></div>';
    }).join('');
    return;
  }
  el.innerHTML = coins.map(function(sym) {
    var info = cgMap[sym];
    var coin = marketCache.find(function(c) { return c.id === info.id; });
    if (!coin) return '';
    var up = (coin.price_change_percentage_24h||0) >= 0;
    var ch = (coin.price_change_percentage_24h||0).toFixed(2);
    var spark = coin.sparkline_in_7d ? sampleArr(coin.sparkline_in_7d.price, 30) : [];
    var prc = coin.current_price >= 1
      ? '$'+coin.current_price.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})
      : '$'+coin.current_price.toFixed(4);
    return '<div class="market-card">'+
      '<img class="market-icon" src="'+(cryptoIcons[sym]||'')+'" alt="'+sym+'" onerror="this.outerHTML=\'<div class=market-icon style=display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--yellow)>'+(cryptoFallback[sym]||sym[0])+'</div>\'">'+
      '<div class="market-info"><div class="market-name">'+info.name+'</div><div class="market-sym">'+sym+'</div></div>'+
      '<div class="market-right">'+sparkSvg(spark,up,56,24)+
        '<div><div class="market-price">'+prc+'</div>'+
          '<div class="market-change '+(up?'up':'down')+'">'+(up?'+':'')+ch+'%</div></div></div></div>';
  }).join('');
}

// WALLET VALIDATION
function validateBTC(addr) {
  if (!addr) return false;
  addr = addr.trim();
  if (/^(1|3)[A-HJ-NP-Za-km-z1-9]{25,34}$/.test(addr)) return true;
  if (/^bc1[a-zA-HJ-NP-Z0-9]{25,62}$/.test(addr)) return true;
  return false;
}
function validateETH(addr) {
  if (!addr) return false;
  return /^0x[0-9a-fA-F]{40}$/.test(addr.trim());
}
function validateTON(addr) {
  if (!addr) return false;
  addr = addr.trim();
  if (/^(UQ|EQ|kQ|0Q)[A-Za-z0-9_-]{46}$/.test(addr)) return true;
  if (/^[A-Fa-f0-9]{64}$/.test(addr)) return true;
  return false;
}
function validateBNB(addr) {
  if (!addr) return false;
  addr = addr.trim();
  if (/^bnb1[a-z0-9]{38}$/.test(addr)) return true;
  if (/^0x[0-9a-fA-F]{40}$/.test(addr)) return true;
  return false;
}
function validateSOL(addr) {
  if (!addr) return false;
  return /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(addr.trim());
}
function validateUSDT(addr) {
  if (!addr) return false;
  addr = addr.trim();
  if (/^0x[0-9a-fA-F]{40}$/.test(addr)) return true;
  if (/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(addr)) return true;
  return false;
}

var cryptoValidators = {
  BTC: validateBTC, ETH: validateETH, USDT: validateUSDT,
  TON: validateTON, BNB: validateBNB, SOL: validateSOL, STARS: null
};

function maskAddress(addr) {
  if (!addr || addr.length < 12) return addr || '';
  return addr.substring(0,6) + '••••••' + addr.substring(addr.length - 4);
}

function toggleCryptoExpand(sym) {
  expandedCrypto[sym] = !expandedCrypto[sym];
  renderWalletCryptoList();
}

function onWalletCryptoInput(sym) {
  var input = document.getElementById('winput-' + sym);
  var status = document.getElementById('wstatus-' + sym);
  if (!input || !status) return;
  var val = input.value.trim();
  if (!val) {
    input.classList.remove('valid','invalid');
    status.textContent = '';
    status.className = 'wcrypto-status';
    return;
  }
  var validator = cryptoValidators[sym];
  if (!validator) { status.textContent = ''; return; }
  var valid = validator(val);
  if (valid) {
    input.classList.add('valid'); input.classList.remove('invalid');
    status.textContent = t('valid_address');
    status.className = 'wcrypto-status ok';
  } else {
    input.classList.add('invalid'); input.classList.remove('valid');
    status.textContent = t('invalid_address');
    status.className = 'wcrypto-status err';
  }
}

function saveWalletCrypto(sym) {
  var input = document.getElementById('winput-' + sym);
  if (!input) return;
  var val = input.value.trim();
  if (!val) return;
  var validator = cryptoValidators[sym];
  if (validator && !validator(val)) { onWalletCryptoInput(sym); return; }
  savedWallets[sym.toLowerCase()] = val;
  try { localStorage.setItem('p2p_wallets', JSON.stringify(savedWallets)); } catch(e){}
  renderWalletCryptoList();
}

function editWalletCrypto(sym) {
  delete savedWallets[sym.toLowerCase()];
  try { localStorage.setItem('p2p_wallets', JSON.stringify(savedWallets)); } catch(e){}
  renderWalletCryptoList();
}

function scrollToWalletCrypto() {
  var el = document.getElementById('wallet-crypto-list');
  if (el) el.scrollIntoView({behavior:'smooth'});
  walletCryptos.forEach(function(c) { expandedCrypto[c.sym] = true; });
  renderWalletCryptoList();
}

// 3D COIN INTERACTION
function initCoin3D() {
  var wrap = document.getElementById('coin3d-wrap');
  var coin = document.getElementById('coin3d');
  if (!wrap || !coin) return;

  var isInteracting = false;
  function onMove(x, y) {
    var rect = wrap.getBoundingClientRect();
    var cx = (x - rect.left) / rect.width - 0.5;
    var cy = (y - rect.top) / rect.height - 0.5;
    coin.style.transform = 'rotateY('+( cx*40)+'deg) rotateX('+(-cy*40)+'deg) translateY(-8px)';
  }
  wrap.addEventListener('mouseenter', function() {
    isInteracting = true; coin.classList.add('interacting');
  });
  wrap.addEventListener('mousemove', function(e) {
    if (isInteracting) onMove(e.clientX, e.clientY);
  });
  wrap.addEventListener('mouseleave', function() {
    isInteracting = false; coin.classList.remove('interacting');
    coin.style.transform = '';
  });
  wrap.addEventListener('touchstart', function(e) {
    isInteracting = true; coin.classList.add('interacting');
    onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  wrap.addEventListener('touchmove', function(e) {
    if (isInteracting) onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  wrap.addEventListener('touchend', function() {
    isInteracting = false; coin.classList.remove('interacting');
    coin.style.transform = '';
  });
}

// DEAL
var dealTimeLeft = 1800;

function openDeal(id) {
  var deal = deals.find(function(d) { return d.id === id; });
  if (!deal) return;
  currentDeal = Object.assign({}, deal);
  dealTimeLeft = 1800;
  chatMessages = [{id:1,sender_id:2,first_name:'Alex',text:'Ready to trade. Please send payment.',
    created_at:new Date().toISOString()}];
  renderDeal();
  showPage('deal');
}

function openDealFromOrder(orderId) {
  currentDeal = {id: deals.length+1, order_id:orderId, buyer_id:1, seller_id:2,
    crypto_currency:'USDT', fiat_currency:'RUB', price:0, crypto_amount:0,
    fiat_amount:0, status:'pending', created_at:new Date().toISOString()};
  var order = orders.find(function(o) { return o.id === orderId; });
  if (order) {
    currentDeal.crypto_currency = order.crypto_currency;
    currentDeal.fiat_currency = order.fiat_currency;
    currentDeal.price = order.price;
  }
  dealTimeLeft = 1800;
  chatMessages = [];
  renderDeal();
  showPage('deal');
}

function renderDeal() {
  if (!currentDeal) return;
  var d = currentDeal;
  document.getElementById('deal-title').textContent = t('deal_title',{id:String(d.id)});
  document.getElementById('deal-badge').innerHTML = '<span class="badge badge-'+d.status+'">'+t(d.status)+'</span>';

  document.getElementById('deal-info').innerHTML =
    '<div class="row"><span class="label">'+t('crypto')+'</span><span class="value">'+d.crypto_currency+'</span></div>'+
    '<div class="row"><span class="label">'+t('fiat')+'</span><span class="value">'+d.fiat_currency+'</span></div>'+
    '<div class="row"><span class="label">'+t('price')+'</span><span class="value">'+d.price.toLocaleString()+' '+d.fiat_currency+'</span></div>'+
    '<div class="row"><span class="label">'+t('amount')+'</span><span class="value">'+d.crypto_amount+' '+d.crypto_currency+'</span></div>'+
    '<div style="border-top:1px solid var(--border);padding-top:8px;margin-top:8px;display:flex;justify-content:space-between;align-items:center">'+
      '<span style="color:var(--t2);font-size:13px">'+t('total')+'</span>'+
      '<span style="font-size:18px;font-weight:700">'+d.fiat_amount.toLocaleString()+' '+d.fiat_currency+'</span></div>';

  if (d.status === 'pending') {
    document.getElementById('deal-timer').innerHTML = '<div class="timer-box">'+
      '<div class="label">'+t('time_left')+'</div>'+
      '<div class="time" id="timer-display">'+fmtTime(dealTimeLeft)+'</div></div>';
    if (dealTimerInterval) clearInterval(dealTimerInterval);
    dealTimerInterval = setInterval(function() {
      dealTimeLeft = Math.max(0, dealTimeLeft - 1);
      var el = document.getElementById('timer-display');
      if (el) el.textContent = fmtTime(dealTimeLeft);
    }, 1000);
  } else {
    document.getElementById('deal-timer').innerHTML = '';
    if (dealTimerInterval) clearInterval(dealTimerInterval);
  }

  var isBuyer = d.buyer_id === user.id;
  var actions = '';
  if (d.status === 'pending' && isBuyer) {
    actions = '<button class="btn-green" style="flex:1" onclick="dealMarkPaid()">'+t('mark_paid')+'</button>'+
      '<button class="btn-red-o" style="flex:1" onclick="dealCancel()">'+t('cancel_deal')+'</button>';
  } else if (d.status === 'paid' && !isBuyer) {
    actions = '<button class="btn-green" style="flex:1" onclick="dealConfirm()">'+t('confirm_receipt')+'</button>';
  } else if (d.status === 'pending' && !isBuyer) {
    actions = '<p style="color:var(--t2);font-size:14px;text-align:center;width:100%;padding:12px">'+t('buyer')+': '+t('pending')+'...</p>';
  }
  document.getElementById('deal-actions').innerHTML = actions;

  document.getElementById('lbl-chat').textContent = t('chat');
  document.getElementById('btn-chat-send').textContent = t('send');
  renderChat();
}

function fmtTime(s) {
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
function dealMarkPaid() { if (!currentDeal) return; currentDeal.status = 'paid'; renderDeal(); }
function dealConfirm() { if (!currentDeal) return; currentDeal.status = 'completed'; renderDeal(); }
function dealCancel() { if (!currentDeal) return; currentDeal.status = 'cancelled'; renderDeal(); }

function renderChat() {
  var el = document.getElementById('chat-messages');
  el.innerHTML = chatMessages.map(function(m) {
    var mine = m.sender_id === user.id;
    return '<div class="chat-msg '+(mine?'mine':'other')+'">'+
      (!mine ? '<div class="sender">'+(m.first_name||'User')+'</div>' : '')+
      '<div>'+m.text+'</div>'+
      '<div class="time">'+new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</div></div>';
  }).join('');
  el.scrollTop = el.scrollHeight;
}

function sendChatMsg() {
  var input = document.getElementById('chat-input');
  var text = input.value.trim();
  if (!text) return;
  chatMessages.push({id:chatMessages.length+1, sender_id:user.id, first_name:user.first_name,
    text:text, created_at:new Date().toISOString()});
  input.value = '';
  renderChat();
}

  var totalDeals = deals.length;
  var completedDeals = deals.filter(function(d) { return d.status === 'completed'; }).length;
  var activeDeals = deals.filter(function(d) { return d.status === 'pending' || d.status === 'paid'; }).length;

  document.getElementById('stat-total').textContent = totalDeals;
  document.getElementById('stat-turnover').textContent = '$' + turnover.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});

  document.getElementById('stat-active').textContent = activeDeals;
